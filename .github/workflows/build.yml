name: Build Equilibrium Grain Windows
on:
  push:
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'CMakeLists.txt'
      - '!**/*.md'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows
        run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Equilibrium-Grain-quality-Windows-x64
          path: |
            build/quality-reports/
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
      - name: Package Windows
        shell: pwsh
        run: |
          $root = "build/EquilibriumGrain_artefacts/Release"
          if (!(Test-Path "$root/VST3/Equilibrium Grain.vst3")) { throw "Missing VST3" }
          if (!(Test-Path "$root/Standalone/Equilibrium Grain.exe")) { throw "Missing standalone" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item docs/Manuel-utilisateur-FR.md dist/
          Compress-Archive -Path "$root/VST3","$root/Standalone" -DestinationPath dist/Equilibrium-Grain-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Equilibrium-Grain-windows-2022
          path: dist/*
          if-no-files-found: error
