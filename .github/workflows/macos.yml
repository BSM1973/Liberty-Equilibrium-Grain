name: Build Equilibrium Grain macOS
on:
  push:
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/macos.yml'
  workflow_dispatch:
concurrency:
  group: equilibrium-grain-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify native Apple Silicon runner
        run: |
          sw_vers
          test "$(uname -m)" = arm64
          xcodebuild -version
      - name: Configure macOS
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Package macOS
        run: |
          set -euo pipefail
          test -d "build/EquilibriumGrain_artefacts/Release/AU/Equilibrium Grain.component"
          test -d "build/EquilibriumGrain_artefacts/Release/VST3/Equilibrium Grain.vst3"
          test -d "build/EquilibriumGrain_artefacts/Release/Standalone/Equilibrium Grain.app"
          mkdir -p dist
          tar -czf dist/Equilibrium-Grain-macOS-arm64.tar.gz -C build/EquilibriumGrain_artefacts/Release AU VST3 Standalone
      - uses: actions/upload-artifact@v4
        with:
          name: Equilibrium-Grain-macOS-arm64
          path: dist/*
          if-no-files-found: error
